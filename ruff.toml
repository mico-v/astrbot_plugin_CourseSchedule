# The plugin's user-facing strings and most code comments are Chinese, so the
# "ambiguous unicode character" rules would flag every full-width colon and
# comma.  Line length is not enforced: several dictionaries and long Chinese
# reply strings read better on one line.
target-version = "py310"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "SIM", "RET", "PIE", "PERF", "PLW", "ARG"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
    # Optional-dependency and platform API guards are intentionally broad; the
    # plugin must never crash because a font, adapter or AstrBot version
    # behaves differently.
    "BLE001",
    # A normalized timestamp reads as an if/else, not as one long expression.
    "SIM108",
]

# The tree was hand-formatted with a wider line length than ruff's formatter
# default, so `ruff format` is available for new files but is not run over the
# whole repository.
[lint.per-file-ignores]
# Tests define fake events, clients and platforms, so unused arguments are the
# point rather than a mistake.
"tests/*" = ["ARG"]
